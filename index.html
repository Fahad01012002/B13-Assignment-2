<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Wave</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="body inter-font">

    <!-- Heeader section -->
    <header class="header">
        <nav class="navbar display-flex width">
            <div class="logo">
                <span class="white">Tech</span><span class="gradient">Wave</span>
            </div>

            <ul class="nav-links display-flex">
                <li><a href="" class="nav-link">About</a></li>
                <li><a href="" class="nav-link">Episodes</a></li>
                <li><a href="" class="nav-link">Host</a></li>
            </ul>
            <button class="primary-btn">
                Subscribe <i class="fa-solid fa-arrow-right"></i>
            </button>
        </nav>

        <div class="line"></div>
        <!-- Banner section -->
        <section class="banner">

            <div class="image">
                <img src="assets/microphone.png" alt="">
            </div>

            <div class="section-content">
                <h2 class="section-heading">TechWave</h2>
                <p class="section-description">Your daily dose of tech insights, productivity hacks, and personal growth
                </p>
                <div class="btn">
                    <button class="primary-btn"><i class="fa-brands fa-spotify"></i> Listen On Spotify</button>
                    <button class="secondary-btn">
                        <i class="fa-regular fa-envelope"></i> Subscribe
                    </button>
                </div>
            </div>
        </section>
    </header>

    
</body>

</html>
